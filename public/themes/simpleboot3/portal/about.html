<!DOCTYPE html>
<html>
  <head>
    <title>{$page.post_title}</title>
    <meta name="keywords" content="{$page.post_keywords}" />
    <meta name="description" content="{$page.post_excerpt}" />
    <link
      rel="stylesheet"
      href="__TMPL__/public/assets/swiper/swiper-bundle.min.css"
    />
    <include file="public@head" />
    <hook name="before_head_end" />
  </head>
  <body class="page-page about-page">
    <include file="public@nav" />
    <widget name="box1">
      <div
        class="box box1 flex aic jcc por-r"
        style="
          background-image: url('{:cmf_get_image_url($widget.vars.image)}');
          padding-top: calc(64px + 2rem);
        "
      >
        <video
          autoplay
          muted
          loop
          src="{:cmf_get_image_url($widget.vars.video)}"
          class="d-none d-lg-block pos-a"
        ></video>

        <div class="info flex aic jcc">
          <div class="container text-white">
            <div class="row">
              <div class="col-lg-6">
                <img
                  src="__TMPL__/public/assets/images/logo.png"
                  class="d-block h-80 mb-4"
                  alt=""
                />
                <h2 class="fw-600">{$widget.vars.title}</h2>
                <p>{$widget.vars.des}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </widget>
    <widget name="box2">
      <div
        class="box flex aic jcc"
        style="
          background-image: url('{:cmf_get_image_url($widget.vars.image)}');
        "
      >
        <div class="info flex aic jcc">
          <div class="container text-white">
            <div class="row jcfe">
              <div class="col-lg-6">
                <h2 class="fw-600">{$widget.vars.title}</h2>
                <p>{$widget.vars.des}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </widget>
    <widget name="box3">
      <div
        class="box flex aic jcc"
        style="
          background-image: url('{:cmf_get_image_url($widget.vars.image)}');
        "
      >
        <div class="info flex aic jcc w-full">
          <div class="container text-white">
            <div class="row">
              <div class="col-lg-6">
                <h2 class="fw-600">{$widget.vars.title}</h2>
                <p>{$widget.vars.des}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </widget>
    <widget name="box4">
      <div
        class="box flex aic jcc"
        style="
          background-image: url('{:cmf_get_image_url($widget.vars.image)}');
        "
      >
        <div class="info flex aic jcc">
          <div class="container text-white">
            <div class="row jcfe">
              <div class="col-lg-6">
                <h2 class="fw-600">{$widget.vars.title}</h2>
                <p>{$widget.vars.des}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </widget>
    <widget name="box5">
      <div class="box5 flex aic jcc pb-4">
        <div class="container my-5 text-white text-center">
          <div class="_T pt-4 pb-3">{$widget.vars.title}</div>
          <!-- <div class="row mt-3 mt-md-4">
            <foreach name="$widget.vars.list" item="vo">
              <div class="col-md-6 col-lg-4 mt-4">
                <div class="flex flex-col aic jcc item hover-large">
                  <img
                    src="{:cmf_get_image_url($vo.icon)}"
                    class="d-block w-full rounded-xl"
                  />
                  <h2 class="mt-3 mb-2 text-18 lh-1/5">{$vo.title}</h2>
                  <h4 class="mb-2 text-16 lh-1/5">{$vo.position}</h4>
                  <p class="text-15 o-8 lh-1/6">{$vo.des}</p>
                </div>
              </div>
            </foreach>
          </div> -->
          <div class="wow fadeInUp">
            <div class="swiper team mt-3 mt-lg-4">
              <div class="swiper-wrapper">
                <foreach name="$widget.vars.list" item="vo">
                  <div class="swiper-slide flex flex-col aic jcc item">
                    <img
                      src="{:cmf_get_image_url($vo.icon)}"
                      class="d-block w-full rounded-xl"
                    />
                    <div class="p-3 rounded-xl info flex-1 mt-3">
                      <h2 class="mb-3 text-18 lh-1/5">{$vo.title}</h2>
                      <h4 class="mb-2 text-16 lh-1/5">{$vo.position}</h4>
                      <p class="text-15 o-8 lh-1/6" style="white-space: pre-line;">{$vo.des}</p>
                    </div>
                  </div>
                </foreach>
              </div>
              <div class="flex aic jcfe mt-3">
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next ml-4"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </widget>
    <widget name="box6">
      <div
        class="box flex aifs jcc pt-5"
        style="
          background-image: url('{:cmf_get_image_url($widget.vars.image)}');
        "
      >
        <div class="info flex aic jcc pt-md-5">
          <div class="container text-white">
            <div class="text-center">
              <h2 class="fw-600">{$widget.vars.title}</h2>
              <p>{$widget.vars.des}</p>
            </div>
          </div>
        </div>
      </div>
    </widget>
    <include file="public@footer" />
    <script src="__TMPL__/public/assets/swiper/swiper-bundle.min.js"></script>
    <script>
      const newsSwiper = new Swiper(".team", {
        slidesPerView: 1,
        spaceBetween: 15,
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        breakpoints: {
          640: {
            slidesPerView: 1,
            spaceBetween: 30,
          },
          768: {
            slidesPerView: 1.5,
            spaceBetween: 30,
          },
          1024: {
            slidesPerView: 2.5,
            spaceBetween: 30,
          },
          1366: {
            slidesPerView: 3,
            spaceBetween: 30,
          },
        },
      });
    </script>
    <include file="public@scripts" />
    <hook name="before_body_end" />
  </body>
</html>
