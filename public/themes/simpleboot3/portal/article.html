    <script>
      // 为分享链接添加当前页面URL
      $(function () {
        // 遍历所有分享按钮
        $(".share-box a").each(function () {
          // 获取当前元素的href属性
          var href = $(this).attr("href");
          // 修改href属性，添加当前页面URL
          $(this).attr("href", href + window.location.href);
        });
      });
