    <script>
      // 为分享链接添加当前页面URL
      $(function () {
        // 遍历所有分享按钮
        $(".share-box a").each(function () {
          // 获取当前元素的href属性
          var href = $(this).attr("href");
          // 修改href属性，添加当前页面URL
          $(this).attr("href", href + window.location.href);
        });
      });

      function sendEmail() {
        // 创建表单数据对象
        const formData = new FormData();

        // 添加参数，注意URL中不要有反引号
        formData.append("subject", "标题");
        formData.append("content", `<p>{$article.post_content}</p>`);

        // 发送请求
        fetch("/api/portal/sendEmail", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            console.log("Success:", data);
            alert("邮件发送请求已提交");
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("邮件发送请求失败");
          });
      }
    </script>
