<!DOCTYPE html>
<html>
  <head>
    <title>
      {$category.name} {$category.seo_title} {$site_info.site_name|default=''}
    </title>
    <meta
      name="keywords"
      content="{$category.seo_keywords},{$site_info.site_seo_keywords|default=''}"
    />
    <meta
      name="description"
      content="{$category.seo_description},{$site_info.site_seo_description|default=''}"
    />
    <include file="public@head" />
    <hook name="before_head_end" />
    <style>
      .tabs a:first-child{
       font-weight: 600;
       /* font-size: 18px!important; */
      }
    </style>
  </head>
  <body class="page-page media-page news-list-page">
    <include file="public@nav" />
    <div
      class="box flex aic jcc"
      style="
        background-image: url('/upload/default/20250827/85373fa6a321fd3d51e1f51f58be0456.jpg');
        padding-top: calc(64px + 2rem);
        height: calc(64px + 2rem);
        min-height: unset;
      "
    ></div>
    <div class="container my-5">
      <div class="_T pt-4 pb-3 text-white text-center">Media Center</div>
      <div class="tabs d-flex aic jcc mt-4 mb-4">
        <portal:subCategories categoryId="1" item="vo">
          <if condition="$vo.id==$category.id">
            <a
              class="active rounded"
              href="{:cmf_url('portal/List/index',array('id'=>$vo.id))}"
              ><if condition="$vo.id==3"><i class="iconfont icon-gonggao mr-2 c" style="font-size: 20px;"></i></if>{$vo.name}</a
            >
            <else />
            <a class="rounded" href="{:cmf_url('portal/List/index',array('id'=>$vo.id))}"
              ><if condition="$vo.id==3"><i class="iconfont icon-gonggao mr-2 c" style="font-size: 20px;"></i></if>{$vo.name}</a
            >
          </if>
        </portal:subCategories>
      </div>
      <div class="row news">
        <php>
          $where= function($query){ $query->where('post.create_time','>=',0); };
          $page=[ 'list_rows'=>12, 'next'=>'下一页', 'prev'=>'上一页' ];
        </php>

        <portal:articles
          item="vo"
          where="$where"
          order="post.published_time DESC"
          page="$page"
          relation="categories"
          categoryIds="$category.id"
          returnVarName="articles_data"
        >
          <div class="col-md-6 col-lg-4 mt-3 mt-lg-4">
            <a
            href="{:cmf_url('portal/Article/index',array('id'=>$vo['id']))}"
            class="item rounded-xl d-flex flex-col overflow-hidden text-white h-full"
          >
            <div class="img-box">
              <div
              class="img w-full"
              style="
                background-image: url('{:cmf_get_image_url($vo.more.thumbnail)}');
              "
            ></div>
            </div>
            <div class="info p-3 flex-1 w-full d-flex flex-col">
              <div class="flex-1">
                <div class="flex aic">
                  <!--<span class="text-red-500">Viewpoint</span>-->
                  <span
                    ><?php echo date('F j.Y', $vo['published_time']); ?></span
                  >
                </div>
                <h2 class="text-20 my-3 line-2">{$vo.post_title}</h2>
                <p class="mb-4 lh-1/6 line-2">{$vo.post_excerpt}</p>
              </div>
              <i class="iconfont icon-outline-arrow-right-3 text-28"></i>
            </div>
          </a>
          </div>
        </portal:articles>
      </div>
      <div class="flex aic jcc mt-4">
        <ul class="pagination">
          <page />
        </ul>
      </div>
    </div>
    <include file="public@footer" />
    <include file="public@scripts" />
    <hook name="before_body_end" />
  </body>
</html>
